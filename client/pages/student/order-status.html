<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status - Signals Std. Cafe'</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts + shared theme (palette, buttons, focus states) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/theme.css">
    
    <link rel="stylesheet" href="../../css/student/order-status.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <a class="navbar-brand" href="home.html">
                    <span class="brand-script">Signals Std. Cafe'</span>
                </a>
                <div class="d-flex gap-3">
                    <a href="home.html" class="nav-link">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user"></i> Profile
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Success Hero -->
    <div class="success-hero">
        <div class="container">
            <div class="success-icon">
                <i class="fas fa-check" id="headerIcon"></i>
            </div>
            <h1 id="headerTitle">Your order</h1>
            <p id="headerText">This page updates on its own.</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Order Header -->
        <div class="order-header">
            <div class="order-id">
                <h2 id="orderIdDisplay">Order</h2>
                <span class="order-badge" id="orderStatus">&hellip;</span>
            </div>
            <div class="order-actions">
                <button class="btn-outline" onclick="downloadReceipt()">
                    <i class="fas fa-download"></i> Receipt
                </button>
                <button class="btn-outline" onclick="window.location.href='home.html'">
                    <i class="fas fa-home"></i> New Order
                </button>
            </div>
        </div>

        <!-- Pickup Info Banner -->
        <div class="pickup-banner">
            <i class="fas fa-clock"></i>
            <div class="pickup-info">
                <h4>Estimated Pickup Time</h4>
                <p id="pickupTimeDisplay">&mdash;</p>
            </div>
        </div>

        <!-- Status Timeline -->
        <div class="status-timeline">
            <h3 class="timeline-title">Order Progress</h3>
            <div class="closed-banner" id="closedBanner" hidden></div>
            <div class="timeline" id="timeline" aria-live="polite"></div>
            <div class="cancel-row" id="cancelRow" hidden>
                <span id="cancelHint"></span>
                <button class="btn-outline btn-cancel-order" onclick="cancelOrder()">
                    <i class="fas fa-times"></i> Cancel order
                </button>
            </div>
        </div>

        <!-- Details Grid -->
        <div class="details-grid">
            <!-- Customer Details -->
            <div class="detail-card">
                <h3><i class="fas fa-user"></i> Customer Details</h3>
                <div class="detail-row">
                    <span class="detail-label">Name</span>
                    <span class="detail-value" id="customerName">&mdash;</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Student ID</span>
                    <span class="detail-value" id="studentId">&mdash;</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Phone</span>
                    <span class="detail-value" id="phoneNumber">&mdash;</span>
                </div>
            </div>

            <!-- Payment Details -->
            <div class="detail-card">
                <h3><i class="fas fa-wallet"></i> Payment Details</h3>
                <div class="detail-row">
                    <span class="detail-label">Method</span>
                    <span class="detail-value" id="paymentMethod">&mdash;</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status</span>
                    <span class="detail-value" id="paymentStatus">&mdash;</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Amount</span>
                    <span class="detail-value" id="totalAmount">&mdash;</span>
                </div>
            </div>
        </div>

        <!-- Order Items -->
        <div class="order-items-card">
            <h3 class="items-title"><i class="fas fa-receipt"></i> Order Items</h3>
            <div id="orderItemsList">
                <!-- Items will be loaded here -->
            </div>
            <div class="total-row">
                <span>Total Amount</span>
                <span id="grandTotal">&mdash;</span>
            </div>
        </div>

        <!-- Refresh Status Button -->
        <button class="refresh-btn" onclick="refreshStatus()">
            <i class="fas fa-sync-alt"></i> Refresh Status
        </button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/store.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="../../js/student/order-status.js"></script>
</body>
</html>
