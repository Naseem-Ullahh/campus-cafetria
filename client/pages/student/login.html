<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Signals Std. Cafe'</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts + shared theme (palette, buttons, focus states) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/theme.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/student/login.css">
</head>
<body class="soft-ui">
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <h1 class="brand-script">Signals Std. Cafe'</h1>
            <p>Pre-order from the campus cafeteria</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tab Header -->
            <div class="tab-header">
                <button class="tab-btn active" onclick="switchTab('login')">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button class="tab-btn" onclick="switchTab('register')">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Alert Message -->
                <div id="alertMessage" class="alert"></div>

                <!-- Login Form -->
                <div id="loginForm" class="form-section active">
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label class="form-label" for="loginStudentId">University ID or email</label>
                            <div class="input-wrapper">
                                <i class="fas fa-id-card input-icon"></i>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="loginStudentId" 
                                    placeholder="e.g. STU001 or EMP-1001"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="loginPassword">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="loginPassword" 
                                    placeholder="Enter your password"
                                    required
                                >
                                <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-check">
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe">Remember me</label>
                        </div>

                        <button type="submit" class="btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>

                        <div class="forgot-link">
                            <a href="#" onclick="showAlert('Password reset feature coming soon!', 'success')">Forgot Password?</a>
                        </div>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="registerForm" class="form-section">
                    <form onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label class="form-label" for="regUserType">I am a</label>
                            <div class="input-wrapper">
                                <i class="fas fa-users input-icon"></i>
                                <select class="form-control" id="regUserType" required>
                                    <option value="student">Student</option>
                                    <option value="faculty">Faculty member</option>
                                    <option value="staff">Staff member</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regName">Full Name</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="regName" 
                                    placeholder="Enter your full name"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regStudentId">University ID</label>
                            <div class="input-wrapper">
                                <i class="fas fa-id-card input-icon"></i>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="regStudentId" 
                                    placeholder="Student or employee ID, e.g. STU001"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regEmail">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope input-icon"></i>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="regEmail" 
                                    placeholder="you@university.edu"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regPhone">Phone Number</label>
                            <div class="input-wrapper">
                                <i class="fas fa-phone input-icon"></i>
                                <input 
                                    type="tel" 
                                    class="form-control" 
                                    id="regPhone" 
                                    placeholder="03XX XXXXXXX"
                                    inputmode="tel"
                                    autocomplete="tel"
                                    aria-describedby="regPhoneHint"
                                    required
                                >
                            </div>
                            <small class="form-hint" id="regPhoneHint">Pakistani mobile number, e.g. 0300 1234567</small>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regPassword">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="regPassword" 
                                    placeholder="Create a strong password"
                                    required
                                >
                                <button type="button" class="password-toggle" onclick="togglePassword('regPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="regConfirmPassword" 
                                    placeholder="Re-enter your password"
                                    required
                                >
                                <button type="button" class="password-toggle" onclick="togglePassword('regConfirmPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary">
                            <i class="fas fa-user-plus"></i> Register
                        </button>
                    </form>
                </div>

                <!-- Admin Link -->
                <div class="divider">
                    <span>OR</span>
                </div>
                <div class="admin-link">
                    <a href="../admin/login.html">
                        <i class="fas fa-user-shield"></i> Staff login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/store.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="../../js/student/login.js"></script>
</body>
</html>
