<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Receipt - Signals Std. Cafe'</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts + shared theme (palette, buttons, focus states) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/theme.css">

    <link rel="stylesheet" href="../../css/student/receipt.css">
</head>
<body>

<div class="container px-3">
    <div class="receipt-card">

        <div class="text-center">
            <i class="fas fa-check-circle success-icon"></i>
            <h3 class="mt-3">Order Placed Successfully!</h3>
            <p class="text-muted">Thank you! We&rsquo;ll have it ready for your pickup time.</p>
        </div>

        <hr>

        <div class="d-flex justify-content-between flex-wrap gap-2 meta">
            <span>Order ID: <strong id="orderId"></strong></span>
            <span id="orderDate"></span>
        </div>
        <div class="meta mt-1" id="pickupInfo"></div>

        <table class="table mt-3 mb-2">
            <thead class="table-light">
                <tr>
                    <th>Item</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Price</th>
                    <th class="text-end">Total</th>
                </tr>
            </thead>
            <tbody id="receiptItems"></tbody>
        </table>

        <div class="d-flex justify-content-between"><span>Payment</span><span id="paymentInfo"></span></div>
        <div class="d-flex justify-content-between fw-bold fs-5 mt-2"><span>Grand Total</span><span id="grandTotal"></span></div>

        <div class="d-grid gap-2 mt-4 no-print">
            <a href="order-status.html" class="btn btn-primary"><i class="fas fa-clock"></i> Track Order Status</a>
            <button class="btn btn-outline-secondary" onclick="window.print()"><i class="fas fa-print"></i> Print Receipt</button>
            <a href="home.html" class="btn btn-link">Back to Menu</a>
        </div>
    </div>
</div>

    <script src="../../js/store.js"></script>
    <script src="../../js/student/receipt.js"></script>

</body>
</html>
