<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Signals Std. Cafe'</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts + shared theme (palette, buttons, focus states) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/theme.css">
    
    <link rel="stylesheet" href="../../css/student/cart.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <a class="navbar-brand" href="home.html">
                    <span class="brand-script">Signals Std. Cafe'</span>
                </a>
                <a href="home.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back to Menu
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 class="page-title">
                <i class="fas fa-shopping-cart"></i> Shopping Cart
            </h1>
            <p class="page-subtitle" id="itemCount">Loading...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div id="cartContent">
            <!-- Cart items will be loaded here -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/store.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="../../js/student/cart.js"></script>
</body>
</html>
