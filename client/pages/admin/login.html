<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Signals Std. Cafe'</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts + shared theme (palette, buttons, focus states) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/theme.css">

    <link rel="stylesheet" href="../../css/admin/login.css">
</head>
<body class="soft-ui">

<div class="login-card">
    <div class="text-center mb-4">
        <i class="fas fa-user-shield fa-3x" style="color: var(--dark);"></i>
        <h4 class="mt-3">Staff Login</h4>
        <small class="text-muted">Manager, counter and kitchen staff</small>
    </div>

    <form onsubmit="adminLogin(event)">
        <div class="mb-3">
            <label class="form-label" for="username">Employee ID or email</label>
            <input type="text" id="username" class="form-control" placeholder="e.g. EMP-0001" autocomplete="username" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-admin w-100" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
    </form>

    <p id="error" class="text-danger mt-3 mb-0 text-center" role="alert"></p>

    <div class="text-center mt-3">
        <a href="../student/login.html" class="text-muted small"><i class="fas fa-arrow-left"></i> Back to student login</a>
    </div>
</div>

    <script src="../../js/store.js"></script>
    <script src="../../js/admin/login.js"></script>

</body>
</html>
